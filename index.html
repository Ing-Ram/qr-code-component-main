<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .box {
      min-width: 100vw;
      min-height: 100vh;
      font-family: system-ui;
      background-color: rgb(174, 235, 235);
      display: grid;
      place-items: center;
      margin: auto;
    }
    
    
    
    
    .attribution {  
                     padding: 30px;
                    font-size: 0.7rem;
                    text-align: center;
                    padding-top: 5px;
                    padding-bottom: 20px;
                  
                  }
    .attribution a { color: hsl(228, 45%, 44%); }



    .content {   width: 300px;
                  height: auto;
                  border-radius: 15px;
                  background-color: white;
    }




    .image-container img {    
      width: 270px;
      height: 270px;
      margin: 15px;
      border-radius: 15px;
    }
    
      .text-content { 
        font-size: 1.3rem;
        text-align: center;
        padding-left: 20px;
        padding-right: 20px;
      }

      .h2 {
        font-size: 1.3rem;
        text-align: center;
        padding-left: 20px;
        padding-right: 20px;

      }

      .p {
        font-size: 0.95rem;
        color: gray;
        text-align: center;
        padding-left: 20px;
        padding-right: 20px;

      }
    
  </style>
</head>
<body>

  

  
  <div class="box">
    <div class="content">
      <div class="image-container">
        <img src="images/image-qr-code.png" alt="" class="image">
      </div>
      <div class="text-content">
        <h2>Improve your front-end skills by building projects</h2>
        <p class="QR-text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </div>
  </div>

  
  
  
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Chad Ingram</a>.
  </div>
</body>
</html>
